blank_issues_enabled: false
contact_links:
  - name: A question, or you are not sure it is a bug
    url: https://discord.gg/b9ybveZRs7
    about: "Ask on the REVIBE Discord instead. Questions are easier to answer there, other people can help too, and this repository has no Discussions section."

  - name: Playback stops partway through every track on upstream OuterTune
    url: https://github.com/revibe-music-code/REVIBE/blob/main/docs/BUILDING.md
    about: "That is the known upstream bug REVIBE was made to fix, and it needs no issue: build REVIBE from source, which sits alongside OuterTune rather than replacing it. No APK is published in this repository yet. If it happens on REVIBE itself, that is new and I want the report, so open a bug and say so."

  - name: A translation reads wrong in your language
    url: https://github.com/revibe-music-code/REVIBE/issues/new?template=translation_report.yml
    about: "Most of the translations were not written by native speakers, so please do say if something is wrong, awkward or still in English. A one line report is plenty and you do not need to suggest a replacement."

# Configuration template for optional service integrations.
#
# REVIBE does NOT publish private credentials. This file is committed with EMPTY values so a clean
# clone still builds: the features that need these services detect the empty BuildConfig fields and
# hide themselves instead of failing or sending requests with invalid credentials (see BuiltInKeys.kt).
#
# To enable these integrations in your own build, copy the keys below into local.properties, which
# is gitignored and is read as a fallback by app/build.gradle.kts:
#
#   lastfm.apiKey=<your Last.fm API key>
#   lastfm.apiSecret=<your Last.fm API secret>
#   polls.gistUrl=<https URL of your polls.json gist>
#   polls.umamiUrl=<your Umami collector URL>
#   polls.umamiWebsiteId=<your Umami website id>
#
# Never put real values in this tracked file. Do not invent values here: leaving a key empty is the
# supported, silent-off state.

# Expected entries:
#   lastfm.apiKey, lastfm.apiSecret   a Last.fm API account (last.fm/api/account/create).
#                                     Revoke and replace it if it is ever abused.
#   polls.gistUrl                     the gist holding the poll questions
#   polls.umamiUrl, polls.umamiWebsiteId
#                                     the Umami site poll answers are recorded on
lastfm.apiKey=
lastfm.apiSecret=
polls.gistUrl=
polls.umamiUrl=
polls.umamiWebsiteId=
